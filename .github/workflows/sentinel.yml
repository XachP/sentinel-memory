name: sentinel-memory
# Hourly guardian run: recall memory from Walrus, read Sui mainnet via Tatum, decide, remember, and publish the
# run JSON to docs/data so the GitHub Pages dashboard updates. Secrets: TATUM_API_KEY, MEMWAL_ACCOUNT_ID, MEMWAL_PRIVATE_KEY.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sentinel-memory
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: guardian run (Walrus Memory mainnet)
        env:
          TATUM_API_KEY: ${{ secrets.TATUM_API_KEY }}
          MEMWAL_ACCOUNT_ID: ${{ secrets.MEMWAL_ACCOUNT_ID }}
          MEMWAL_PRIVATE_KEY: ${{ secrets.MEMWAL_PRIVATE_KEY }}
        run: bun src/cli.ts run --memory walrus
      - name: A/B scorecard over all saved runs
        run: bun src/cli.ts ab
      - name: publish run data
        run: |
          git config user.name "sentinel-memory-bot"
          git config user.email "sentinel-memory-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "run $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase && git push
